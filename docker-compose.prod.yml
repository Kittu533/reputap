services:
  postgres:
    image: postgres:16-alpine
    container_name: reputap-db
    restart: always
    environment:
      POSTGRES_DB: reputap
      POSTGRES_USER: reputap
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_reputap_prod_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reputap -d reputap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./reputap-be
      dockerfile: Dockerfile
    container_name: reputap-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      APP_PORT: "8081"
      APP_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: reputap
      DB_USER: reputap
      DB_PASSWORD: ${DB_PASSWORD:-secret_reputap_prod_2026}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-ganti_dengan_random_secret_jwt_minimal_32_karakter}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      APP_BASE_URL: https://${API_DOMAIN:-api.kitangoding.my.id}
      REDIRECT_BASE_URL: https://${API_DOMAIN:-api.kitangoding.my.id}/r
      FRONTEND_URL: ${FRONTEND_URL:-https://app.kitangoding.my.id}
      UPLOAD_DIR: ./uploads
      MAX_UPLOAD_SIZE: "10485760"
    volumes:
      - reputap_uploads:/app/uploads

volumes:
  postgres_prod_data:
  reputap_uploads:

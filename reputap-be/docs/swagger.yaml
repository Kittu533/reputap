basePath: /
definitions:
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/auth.UserInfo'
    type: object
  auth.UserInfo:
    properties:
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      role_id:
        type: integer
      role_name:
        type: string
      status:
        type: string
    type: object
  customers.CreateRequest:
    properties:
      address:
        type: string
      business_name:
        maxLength: 200
        type: string
      city:
        maxLength: 100
        type: string
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 150
        type: string
      notes:
        type: string
      phone:
        maxLength: 20
        type: string
      province:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  customers.Customer:
    properties:
      address:
        type: string
      business_name:
        type: string
      city:
        type: string
      created_at:
        type: string
      customer_code:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
      phone:
        type: string
      province:
        type: string
      updated_at:
        type: string
    type: object
  customers.UpdateRequest:
    properties:
      address:
        type: string
      business_name:
        maxLength: 200
        type: string
      city:
        maxLength: 100
        type: string
      email:
        maxLength: 255
        type: string
      name:
        maxLength: 150
        type: string
      notes:
        type: string
      phone:
        maxLength: 20
        type: string
      province:
        maxLength: 100
        type: string
    required:
    - name
    type: object
  orders.CreateItemRequest:
    properties:
      product_id:
        type: integer
      quantity:
        minimum: 1
        type: integer
      unit_price:
        type: number
    required:
    - product_id
    - quantity
    - unit_price
    type: object
  orders.CreateRequest:
    properties:
      customer_id:
        type: integer
      discount:
        minimum: 0
        type: number
      items:
        items:
          $ref: '#/definitions/orders.CreateItemRequest'
        minItems: 1
        type: array
      notes:
        type: string
      store_id:
        type: integer
    required:
    - customer_id
    - items
    - store_id
    type: object
  orders.Order:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      customer_id:
        type: integer
      discount:
        type: number
      id:
        type: integer
      notes:
        type: string
      order_number:
        type: string
      order_status:
        type: string
      payment_status:
        type: string
      store_id:
        type: integer
      subtotal:
        type: number
      total:
        type: number
      updated_at:
        type: string
    type: object
  orders.OrderDetail:
    properties:
      created_at:
        type: string
      created_by:
        type: integer
      customer_id:
        type: integer
      discount:
        type: number
      id:
        type: integer
      items:
        items:
          $ref: '#/definitions/orders.OrderItem'
        type: array
      notes:
        type: string
      order_number:
        type: string
      order_status:
        type: string
      payment_status:
        type: string
      store_id:
        type: integer
      subtotal:
        type: number
      total:
        type: number
      updated_at:
        type: string
    type: object
  orders.OrderItem:
    properties:
      id:
        type: integer
      order_id:
        type: integer
      product_id:
        type: integer
      quantity:
        type: integer
      subtotal:
        type: number
      unit_price:
        type: number
    type: object
  orders.StatusHistory:
    properties:
      changed_by:
        type: integer
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: integer
      notes:
        type: string
      order_id:
        type: integer
      to_status:
        type: string
    type: object
  orders.UpdatePaymentStatusRequest:
    properties:
      payment_status:
        enum:
        - unpaid
        - partial
        - paid
        - refunded
        type: string
    required:
    - payment_status
    type: object
  orders.UpdateStatusRequest:
    properties:
      notes:
        type: string
      status:
        enum:
        - pending
        - confirmed
        - processing
        - production
        - qc
        - ready_to_ship
        - shipped
        - completed
        - cancelled
        - on_hold
        type: string
    required:
    - status
    type: object
  products.CreateRequest:
    properties:
      description:
        type: string
      finishing:
        maxLength: 50
        type: string
      height_mm:
        minimum: 0
        type: number
      material:
        maxLength: 100
        type: string
      name:
        maxLength: 200
        type: string
      nfc_chip_type:
        maxLength: 50
        type: string
      production_cost:
        minimum: 0
        type: number
      selling_price:
        minimum: 0
        type: number
      sku:
        maxLength: 50
        type: string
      status:
        enum:
        - active
        - inactive
        - discontinued
        type: string
      thickness_mm:
        minimum: 0
        type: number
      width_mm:
        minimum: 0
        type: number
    required:
    - name
    - sku
    type: object
  products.Product:
    properties:
      created_at:
        type: string
      description:
        type: string
      finishing:
        type: string
      height_mm:
        type: number
      id:
        type: integer
      material:
        type: string
      name:
        type: string
      nfc_chip_type:
        type: string
      production_cost:
        type: number
      selling_price:
        type: number
      sku:
        type: string
      status:
        type: string
      thickness_mm:
        type: number
      updated_at:
        type: string
      width_mm:
        type: number
    type: object
  products.UpdateRequest:
    properties:
      description:
        type: string
      finishing:
        maxLength: 50
        type: string
      height_mm:
        minimum: 0
        type: number
      material:
        maxLength: 100
        type: string
      name:
        maxLength: 200
        type: string
      nfc_chip_type:
        maxLength: 50
        type: string
      production_cost:
        minimum: 0
        type: number
      selling_price:
        minimum: 0
        type: number
      sku:
        maxLength: 50
        type: string
      status:
        enum:
        - active
        - inactive
        - discontinued
        type: string
      thickness_mm:
        minimum: 0
        type: number
      width_mm:
        minimum: 0
        type: number
    required:
    - name
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/response.FieldError'
        type: array
      message:
        type: string
    type: object
  response.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  response.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  stores.CreateRequest:
    properties:
      address:
        type: string
      category:
        enum:
        - coffee_shop
        - restaurant
        - barbershop
        - salon
        - clinic
        - retail
        - hotel
        - other
        type: string
      customer_id:
        type: integer
      google_business_name:
        maxLength: 255
        type: string
      name:
        maxLength: 200
        type: string
      review_url:
        maxLength: 500
        type: string
    required:
    - customer_id
    - name
    type: object
  stores.Store:
    properties:
      address:
        type: string
      category:
        type: string
      created_at:
        type: string
      customer_id:
        type: integer
      google_business_name:
        type: string
      id:
        type: integer
      name:
        type: string
      review_url:
        type: string
      review_url_verified:
        type: boolean
      slug:
        type: string
      status:
        type: string
      store_code:
        type: string
      updated_at:
        type: string
    type: object
  stores.UpdateRequest:
    properties:
      address:
        type: string
      category:
        enum:
        - coffee_shop
        - restaurant
        - barbershop
        - salon
        - clinic
        - retail
        - hotel
        - other
        type: string
      google_business_name:
        maxLength: 255
        type: string
      name:
        maxLength: 200
        type: string
    required:
    - name
    type: object
  stores.UpdateReviewURLRequest:
    properties:
      review_url:
        maxLength: 500
        type: string
    required:
    - review_url
    type: object
  stores.UpdateStatusRequest:
    properties:
      status:
        enum:
        - active
        - inactive
        - suspended
        type: string
    required:
    - status
    type: object
host: localhost:8081
info:
  contact:
    email: admin@reputap.id
    name: REPUTAP Team
  description: |-
    Internal API for REPUTAP — Smart Review Stand management system.
    Manages customers, stores, orders, QR codes, NFC, production, QC, shipping, and scan analytics.
  title: REPUTAP API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate admin user with email and password, returns JWT tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "403":
          description: Forbidden
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Login
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: Logout current user (client should discard tokens)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: Returns the authenticated user's profile info
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserInfo'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for new access and refresh tokens
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/auth.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      summary: Refresh token
      tags:
      - Auth
  /api/v1/customers:
    get:
      description: Get paginated list of customers with optional search
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search by name, phone, email, or code
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/customers.Customer'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List customers
      tags:
      - Customers
    post:
      consumes:
      - application/json
      description: Create a new customer with auto-generated customer code
      parameters:
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customers.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/customers.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Create customer
      tags:
      - Customers
  /api/v1/customers/{id}:
    delete:
      description: Delete a customer by ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Delete customer
      tags:
      - Customers
    get:
      description: Get a single customer by their ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/customers.Customer'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get customer by ID
      tags:
      - Customers
    put:
      consumes:
      - application/json
      description: Update an existing customer by ID
      parameters:
      - description: Customer ID
        in: path
        name: id
        required: true
        type: integer
      - description: Customer data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customers.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/customers.Customer'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Update customer
      tags:
      - Customers
  /api/v1/orders:
    get:
      description: Get paginated list of orders with optional filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Search by order number
        in: query
        name: search
        type: string
      - description: Filter by customer ID
        in: query
        name: customer_id
        type: integer
      - description: Filter by store ID
        in: query
        name: store_id
        type: integer
      - description: Filter by order status
        in: query
        name: status
        type: string
      - description: Filter by payment status
        in: query
        name: payment_status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/orders.Order'
                  type: array
                meta:
                  $ref: '#/definitions/response.Meta'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: List orders
      tags:
      - Orders
    post:
      consumes:
      - application/json
      description: Create a new order with items
      parameters:
      - description: Order data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/orders.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/orders.OrderDetail'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "401":
          description: Unauthorized
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Create order
      tags:
      - Orders
  /api/v1/orders/{id}:
    get:
      description: Get a single order with its items by ID
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/orders.OrderDetail'
              type: object
        "404":
          description: Not Found
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                error:
                  $ref: '#/definitions/response.ErrorBody'
              type: object
      security:
      - BearerAuth: []
      summary: Get order by ID
      tags:
      - Orders
  /api/v1/orders/{id}/history:
    get:
      description: Get the status change history of an order
      parameters:
      - description: Order ID
        in: path
        name: id
        required: true

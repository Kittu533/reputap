
name: CI / CD Backend

on:
  push:
    branches:
      - main
    paths:
      - 'reputap-be/**'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'reputap-be/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: reputap-be/go.sum

      # 3. Build Linux binaries
      - name: Build Linux Binaries
        working-directory: reputap-be
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-w -s" -o server ./cmd/server

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -ldflags="-w -s" -o migrate ./cmd/migrate

      # 4. Deploy to VPS
      - name: Deploy to VPS via SSH
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}

        run: |
          set -e

          # Validate secrets
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::Missing VPS secrets"
            exit 1
          fi

          # Setup SSH
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/reputap_deploy
          chmod 600 ~/.ssh/reputap_deploy

          ssh-keyscan -H -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          # SSH options
          SSH_KEY_FILE="$HOME/.ssh/reputap_deploy"

          echo "Testing SSH connection..."

          ssh -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "echo SSH_AUTHENTICATION_SUCCESS"

          # Upload binaries
          echo "Uploading binaries..."

          scp -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -P "$PORT" \
            reputap-be/server \
            reputap-be/migrate \
            "$USER@$HOST:/var/www/reputap/reputap-be/"

          # Upload migrations
          scp -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -P "$PORT" \
            -r reputap-be/migrations \
            "$USER@$HOST:/var/www/reputap/reputap-be/"

          # Run migrations and restart service
          echo "Running migrations..."

          ssh -i "$SSH_KEY_FILE" \
            -o IdentitiesOnly=yes \
            -p "$PORT" \
            "$USER@$HOST" \
            "set -e &&
             cd /var/www/reputap/reputap-be &&
             chmod +x server migrate &&
             ./migrate &&
             sudo systemctl restart reputap &&
             sudo systemctl status reputap --no-pager"

          echo "Deployment completed successfully!"

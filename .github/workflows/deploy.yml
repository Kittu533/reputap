name: CI / CD Backend

on:
  push:
    branches:
      - main
    paths:
      - 'reputap-be/**'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'reputap-be/**'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: reputap-be/go.sum

      - name: Build Linux Binaries (CI Check)
        working-directory: reputap-be
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o server ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o migrate ./cmd/migrate

      - name: Deploy to VPS via SSH (CD on Merge)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          set -e

          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::Missing VPS secrets (VPS_SSH_KEY, VPS_HOST, VPS_USER)"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          SSH_KEY_FILE="$HOME/.ssh/reputap_deploy"
          printf '%s\n' "$SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          ssh-keyscan -H -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

          echo "Testing SSH connection..."
          ssh -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -o BatchMode=yes -p "$PORT" "$USER@$HOST" "echo SSH_AUTHENTICATION_SUCCESS"

          echo "Preparing target directories on VPS..."
          ssh -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -p "$PORT" "$USER@$HOST" \
            "sudo mkdir -p /tmp/reputap-deploy /var/www/reputap/reputap-be/migrations /var/www/reputap/reputap-be/uploads && sudo chown -R $USER /tmp/reputap-deploy /var/www/reputap"

          echo "Uploading binaries and service definition..."
          scp -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -P "$PORT" \
            reputap-be/server \
            reputap-be/migrate \
            deploy/reputap.service \
            "$USER@$HOST:/tmp/reputap-deploy/"

          echo "Uploading migrations..."
          scp -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -P "$PORT" \
            -r reputap-be/migrations/* \
            "$USER@$HOST:/var/www/reputap/reputap-be/migrations/"

          echo "Applying update & restarting service..."
          ssh -i "$SSH_KEY_FILE" -o IdentitiesOnly=yes -p "$PORT" "$USER@$HOST" \
            "set -e
             sudo mv /tmp/reputap-deploy/server /var/www/reputap/reputap-be/server
             sudo mv /tmp/reputap-deploy/migrate /var/www/reputap/reputap-be/migrate
             sudo chmod +x /var/www/reputap/reputap-be/server /var/www/reputap/reputap-be/migrate
             sudo mv /tmp/reputap-deploy/reputap.service /etc/systemd/system/reputap.service
             sudo systemctl daemon-reload
             sudo systemctl enable reputap
             cd /var/www/reputap/reputap-be
             sed -i 's/DB_PORT=5433/DB_PORT=5432/g' .env 2>/dev/null || true
             sed -i 's/DB_PORT = 5433/DB_PORT = 5432/g' .env 2>/dev/null || true
             ./migrate
             sudo systemctl restart reputap
             sudo systemctl status reputap --no-pager"

          echo "Deployment completed successfully!"

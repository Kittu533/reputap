name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'reputap-be/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: reputap-be/go.sum

      - name: Build Linux Binaries
        working-directory: reputap-be
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o server ./cmd/server
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o migrate ./cmd/migrate

      - name: Deploy to VPS via SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$HOST" ] || [ -z "$USER" ]; then
            echo "::error::Missing VPS secrets (VPS_SSH_KEY, VPS_HOST, VPS_USER). Set them in repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

          echo "🚀 Uploading binaries and migrations to VPS..."
          scp -P "$PORT" reputap-be/server reputap-be/migrate "$USER@$HOST:/var/www/reputap/"
          scp -P "$PORT" -r reputap-be/migrations "$USER@$HOST:/var/www/reputap/"

          echo "🔄 Running migrations & restarting reputap service..."
          ssh -p "$PORT" "$USER@$HOST" bash -c "'
            set -e
            chmod +x /var/www/reputap/server /var/www/reputap/migrate
            cd /var/www/reputap
            ./migrate
            systemctl restart reputap
            systemctl status reputap --no-pager
          '"

          echo "✅ Deployment completed successfully!"

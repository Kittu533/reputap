services:
  postgres:
    image: postgres:16-alpine
    container_name: reputap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reputap
      POSTGRES_USER: reputap
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
